name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # 2. 设置 Java 17 (关键：GitHub Actions 默认可能是 Java 11/21)
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      # 3. 设置 Flutter
      - name: Setup Flutter
        uses: flutter-actions/setup-flutter@v4
        with:
          channel: 'stable'
          version: '3.44.0'
          cache: true
      
      # 4. 获取依赖
      - name: Get dependencies
        run: flutter pub get
        working-directory: .
      
      # 5. 代码分析
      - name: Analyze code
        run: flutter analyze
        working-directory: .
      
      # 6. 运行测试
      - name: Run tests
        run: flutter test
        working-directory: .
      
      # 7. 构建 Release APK
      - name: Build APK
        run: flutter build apk --release --split-per-abi
        working-directory: .
      
      # 8. 上传构建产物
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            build/app/outputs/flutter-apk/*.apk
          retention-days: 30
      
      # 9. 准备发布信息
      - name: Prepare release notes
        id: release_notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.inputs.version }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=Release $TAG" >> $GITHUB_OUTPUT
          echo "body=$(git log --oneline -10)" >> $GITHUB_OUTPUT
      
      # 10. 创建 GitHub Release 并上传 APK
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.release_notes.outputs.tag }}
          name: ${{ steps.release_notes.outputs.name }}
          body: |
            ## 实时翻译 - ${{ steps.release_notes.outputs.tag }}
            
            ### 更新内容
            ${{ steps.release_notes.outputs.body }}
            
            ### 下载
            - `app-release.apk` - 通用 APK (包含所有 ABI)
            - `app-arm64-v8a-release.apk` - ARM64 设备
            - `app-armeabi-v7a-release.apk` - ARM32 设备
            - `app-x86_64-release.apk` - x86_64 设备
            
            ### 安装说明
            1. 下载对应架构的 APK 文件
            2. 在手机上启用"允许安装未知来源应用"
            3. 安装 APK
            4. 打开应用，授予必要权限（录音、悬浮窗、通知）
            5. 在快捷设置面板添加"实时翻译"磁贴
            6. 点击磁贴或应用内按钮开始实时翻译
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}