name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # 2. 立即删除桌面端目录（checkout 后立即执行，防止后续步骤触发符号链接权限问题）
      - name: Remove desktop directories immediately
        run: |
          rm -rf linux macos windows 2>/dev/null || true
      
      # 3. 删除 sherpa-onnx 模型目录（防止被打包进 APK，导致体积巨大）
      - name: Remove sherpa-onnx model directories
        run: |
          rm -rf sherpa-onnx-streaming-zipformer-* 2>/dev/null || true
          rm -rf sherpa-onnx-streaming-zipformer-*.tar.bz2 2>/dev/null || true
      
      # 4. 设置 Java 17 (关键：GitHub Actions 默认可能是 Java 11/21)
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      # 5. 手动安装 Flutter（完全跳过 flutter-action 及其缓存问题）
      - name: Setup Flutter manually
        run: |
          # 下载并安装 Flutter SDK
          cd $HOME
          git clone -b stable --depth 1 https://github.com/flutter/flutter.git
          export PATH="$PATH:$HOME/flutter/bin"
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          # 禁用桌面端
          flutter config --no-enable-linux-desktop --no-enable-macos-desktop --no-enable-windows-desktop
          # 验证版本
          flutter --version
      
      # 6. 补齐 Android 引擎产物（关键修复：android-arm/flutter.jar 缺失导致 Kotlin 插件编译失败）
      - name: Precache Android engine artifacts
        run: |
          ENGINE_DIR="$HOME/flutter/bin/cache/artifacts/engine"
          # 先补齐（正常情况下这一步就够）
          flutter precache --android --no-ios || true

          # 兜底：Flutter 偶发会留下"目录存在但 flutter.jar 缺失"的残缺缓存，
          # 此时 precache 会误认为已缓存而跳过下载，必须删掉残缺目录强制重下。
          for abi in android-arm android-arm64 android-x64; do
            if [ ! -f "$ENGINE_DIR/$abi/flutter.jar" ]; then
              echo "Detected incomplete cache for $abi, forcing re-download..."
              rm -rf "$ENGINE_DIR/$abi"
              flutter precache --android --no-ios --force || true
              break
            fi
          done

          echo "=== Engine artifacts after precache ==="
          ls -la "$ENGINE_DIR"

          # 硬校验：Gradle 编译所有 Kotlin 插件都要 compileOnly 这个 flutter.jar
          MISSING=0
          for abi in android-arm android-arm64 android-x64; do
            if [ ! -f "$ENGINE_DIR/$abi/flutter.jar" ]; then
              echo "::error::FATAL: missing $ENGINE_DIR/$abi/flutter.jar"
              MISSING=1
            fi
          done
          if [ "$MISSING" -ne 0 ]; then
            echo "flutter.jar still missing after precache. Aborting before Gradle."
            exit 1
          fi
          echo "All required flutter.jar artifacts present."

      # 7. 接受 Android licenses
      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
      
      # 7. 清理构建缓存
      - name: Flutter clean
        run: flutter clean
      
      # 8. 配置 Gradle 内存限制防 OOM
      - name: Configure Gradle memory
        run: |
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2 -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false
          android.enableAapt2Daemon=false
          EOF
      
      # 9. 获取依赖
      - name: Get dependencies
        run: flutter pub get
        working-directory: .
      
      # 10. 代码分析
      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        working-directory: .
      
      # 11. 运行测试
      - name: Run tests
        run: flutter test
        working-directory: .
      
      # 12. 诊断环境信息（便于排查）
      - name: Diagnose environment
        run: |
          echo "=== Flutter doctor ==="
          flutter doctor -v
          echo "=== Android SDK/NDK ==="
          ls -la $ANDROID_HOME/ndk/ 2>/dev/null || echo "NDK not found in $ANDROID_HOME/ndk"
          ls -la $ANDROID_HOME/build-tools/ 2>/dev/null || echo "Build tools not found"
          echo "=== Gradle wrapper ==="
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "=== Project gradle.properties ==="
          cat android/gradle.properties
          echo "=== app build.gradle.kts ==="
          cat android/app/build.gradle.kts | head -50
          echo "=== root build.gradle.kts (compileSdk override) ==="
          sed -n '25,60p' android/build.gradle.kts

      # 13.5 诊断：确认各插件模块 compileSdk 覆盖是否生效
      - name: Diagnose plugin compileSdk
        run: |
          echo "=== Check plugin AAR metadata compileSdk ==="
          for p in $(find ~/.pub-cache/hosted/pub.dev -maxdepth 1 -type d -name "*flutt*" -o -maxdepth 1 -type d -name "system_audio*" 2>/dev/null); do
            f="$p/android/build.gradle"
            [ -f "$f" ] || f="$p/android/build.gradle.kts"
            if [ -f "$f" ]; then
              echo "--- $p ---"
              grep -n -i "compileSdk" "$f" | head -5
            fi
          done
      
      # 13. 构建 Release APK
      - name: Build APK
        run: |
          # 创建构建日志文件
          touch build.log
          echo "=== Build log created at $(date) ===" > build.log
          echo "Working directory: $(pwd)" >> build.log
          echo "PATH: $PATH" >> build.log
          
          echo "=== Starting Flutter build at $(date) ===" >> build.log
          
          # 运行构建并同时输出到控制台和日志文件
          flutter build apk --release --split-per-abi --verbose 2>&1 | tee -a build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          echo "=== Build finished with exit code: $BUILD_EXIT_CODE at $(date) ===" >> build.log
          # 保存退出码到环境变量供后续步骤使用
          echo "BUILD_EXIT_CODE=$BUILD_EXIT_CODE" >> $GITHUB_ENV
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "=== BUILD FAILED ===" >> build.log
            exit 1
          fi
        env:
          FLUTTER_VERBOSE: 1
        # 注意：不再使用 continue-on-error，否则构建失败会被伪装成成功、artifact 为空也"上传成功"
      
      # 14. 确保构建日志文件存在（即使构建失败）
      - name: Ensure build log exists
        if: always()
        run: |
          if [ ! -f build.log ]; then
            echo "=== build.log not found, creating minimal log ===" > build.log
            echo "Build step may have failed before creating log file" >> build.log
            echo "Working directory: $(pwd)" >> build.log
            echo "Build exit code: ${{ env.BUILD_EXIT_CODE }}" >> build.log
            ls -la >> build.log
          fi
      
# 16. 查找 APK 文件
      - name: Find APK files
        run: |
          echo "=== Full build/app/outputs tree ==="
          find build/app/outputs -type f -name "*.apk" 2>/dev/null | head -30 || echo "No APKs found in build/app/outputs"
          # 保存找到的第一个 APK 路径供后续步骤使用
          APK_COUNT=$(find build/app/outputs -type f -name "*.apk" 2>/dev/null | wc -l)
          echo "APK count: $APK_COUNT"
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::No APK produced. Build silently failed, check build.log and the Build APK step."
            exit 1
          fi
          APK_PATH=$(find build/app/outputs -type f -name "*.apk" 2>/dev/null | head -1)
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
          echo "First APK found at: $APK_PATH"

      # 15.5 硬校验：arm64 APK 里必须真的有 llama.cpp 原生库
      #
      # 为什么需要这一步：
      # 历史上 P0-4（libmtmd.so 缺失）在 CI 上一直是绿的 —— 构建成功、APK 能出、
      # 单测全过，只有真机跑到 LlamaMTEngine.initialize() 才失败。
      # 所以「Build APK 成功」不能证明翻译可用，必须直接检查产物内容。
      #
      # 依赖说明：llama_cpp_dart 0.9.x 通过 native assets 钩子
      # （hook/build.dart）+ 自带 AAR 提供这些 .so，Flutter 会把它们复制进
      # APK 的 lib/<abi>/ 下。
      # 上游 AAR 只含 arm64-v8a，所以这里只强制校验 arm64 包；
      # armeabi-v7a / x86_64 包缺库属于已知限制，会让 MT 降级 Mock（不崩溃）。
      - name: Verify llama.cpp native libs inside arm64 APK
        run: |
          set -u

          ARM64_APK=$(find build/app/outputs -type f -name "*arm64-v8a*.apk" | head -1)
          if [ -z "$ARM64_APK" ]; then
            echo "::error::arm64-v8a APK not found; cannot verify native libs."
            exit 1
          fi
          echo "Verifying: $ARM64_APK"

          ENTRIES=$(unzip -l "$ARM64_APK" | awk '{print $4}')
          echo "=== native libs in arm64 APK ==="
          echo "$ENTRIES" | grep '^lib/.*\.so$' || echo "(none)"

          MISSING=0
          for so in libllama.so libmtmd.so libggml.so libggml-base.so libggml-cpu.so; do
            if echo "$ENTRIES" | grep -q "lib/arm64-v8a/$so"; then
              echo "OK   lib/arm64-v8a/$so"
            else
              echo "::error::MISSING lib/arm64-v8a/$so in arm64 APK"
              MISSING=1
            fi
          done

          if [ "$MISSING" -ne 0 ]; then
            echo "llama.cpp native libraries are missing from the arm64 APK."
            echo "Root cause is usually the llama_cpp_dart native-assets hook not running,"
            echo "or the resolved version no longer shipping native/android/llama-cpp-dart.aar."
            exit 1
          fi
          echo "All required llama.cpp native libraries are present in the arm64 APK."

      # 15.6 记录其他 ABI 的原生库情况（只提示，不失败）
      #
      # 上游 AAR 仅 arm64-v8a，armeabi-v7a / x86_64 上 MT 会自动降级 Mock。
      # 这里打印出来，方便判断是否需要后续自建 AAR 补齐。
      - name: Report native libs in other ABIs (informational)
        run: |
          for apk in build/app/outputs/flutter-apk/*.apk; do
            [ -f "$apk" ] || continue
            echo "=== $(basename "$apk") ==="
            unzip -l "$apk" | awk '{print $4}' | grep '^lib/.*\.so$' || echo "(no .so)"
          done
      
      # 15.7 硬校验：overlayMain 必须真的进了 AOT 快照
      #
      # 为什么需要这一步：
      # 这是真机上「悬浮窗窗口出来了但里面一片空白」的根因。
      # flutter_screen_overlay 原生侧用
      #   new DartEntrypoint(bundlePath, "overlayMain")
      # 按**字符串名字**去 libapp.so 里找入口点；而 Dart 编译器是按
      # import 图决定编译单元的 —— v0.3.4 时 overlay_screen.dart 全项目
      # 零 import，整份文件没被编译，`@pragma('vm:entry-point')` 也救不回来。
      #
      # 这类问题的恶劣之处：构建成功、单测全过、Service 也起来，
      # 只有真机才知道是白屏。所以必须直接检查产物内容。
      #
      # `flutter test` 里已有源码断言守住「main.dart 必须 import」，
      # 但源码断言防不住「编译器的实际行为变了」。这里补上产物级证据。
      - name: Verify overlayMain exists in AOT snapshot
        run: |
          set -u
          ARM64_APK=$(find build/app/outputs -type f -name "*arm64-v8a*.apk" | head -1)
          if [ -z "$ARM64_APK" ]; then
            echo "::error::arm64-v8a APK not found; cannot verify overlay entrypoint."
            exit 1
          fi
          echo "Verifying AOT snapshot in: $ARM64_APK"
          # `--src-root lib` 让脚本能区分两种失败：
          #   真回归  → 源码里有、快照里没有 → FAIL（拦构建）
          #   判据过期 → 源码里也没有（UI 文案改过）→ STALE_WARN（放行 + 警告）
          # v0.9.2 就是因为少了这个参数，被一条过期判据（`调节透明度`）
          # 误拦了一次完整构建（其余 7 条判据与 overlayMain 全部命中）。
          python3 tools/verify_overlay_aot.py "$ARM64_APK" --src-root lib

      # 16. 上传构建产物
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/**/*.apk
          retention-days: 30
      
      # 17. 准备发布信息
      - name: Prepare release notes
        id: release_notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.inputs.version }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=Release $TAG" >> $GITHUB_OUTPUT
          # 多行输出必须使用 heredoc 分隔符，否则 GITHUB_OUTPUT 解析失败
          {
            echo 'body<<RELEASE_BODY_EOF'
            git log --oneline -10
            echo 'RELEASE_BODY_EOF'
          } >> $GITHUB_OUTPUT
      
      # 18. 创建 GitHub Release 并上传 APK
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.release_notes.outputs.tag }}
          name: ${{ steps.release_notes.outputs.name }}
          body: |
            ## 实时翻译 - ${{ steps.release_notes.outputs.tag }}
            
            ### 更新内容
            ${{ steps.release_notes.outputs.body }}
            
            ### 下载
            > 本次构建使用 `--split-per-abi`，仅提供分架构 APK，无通用包。

            - `app-arm64-v8a-release.apk` - ARM64 设备（绝大多数现代手机）
            - `app-armeabi-v7a-release.apk` - ARM32 设备
            - `app-x86_64-release.apk` - x86_64 设备
            
            ### 安装说明
            1. 下载对应架构的 APK 文件
            2. 在手机上启用"允许安装未知来源应用"
            3. 安装 APK
            4. 打开应用，授予必要权限（录音、悬浮窗、通知）
            5. 在快捷设置面板添加"实时翻译"磁贴
            6. 点击磁贴或应用内按钮开始实时翻译
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}