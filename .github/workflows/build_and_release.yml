name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如 v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    
    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # 2. 立即删除桌面端目录（checkout 后立即执行，防止后续步骤触发符号链接权限问题）
      - name: Remove desktop directories immediately
        run: |
          rm -rf linux macos windows 2>/dev/null || true
      
      # 3. 删除 sherpa-onnx 模型目录（防止被打包进 APK，导致体积巨大）
      - name: Remove sherpa-onnx model directories
        run: |
          rm -rf sherpa-onnx-streaming-zipformer-* 2>/dev/null || true
          rm -rf sherpa-onnx-streaming-zipformer-*.tar.bz2 2>/dev/null || true
      
      # 4. 设置 Java 17 (关键：GitHub Actions 默认可能是 Java 11/21)
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'
      
      # 5. 手动安装 Flutter（完全跳过 flutter-action 及其缓存问题）
      - name: Setup Flutter manually
        run: |
          # 下载并安装 Flutter SDK
          cd $HOME
          git clone -b stable --depth 1 https://github.com/flutter/flutter.git
          export PATH="$PATH:$HOME/flutter/bin"
          echo "$HOME/flutter/bin" >> $GITHUB_PATH
          # 禁用桌面端
          flutter config --no-enable-linux-desktop --no-enable-macos-desktop --no-enable-windows-desktop
          # 验证版本
          flutter --version
      
      # 6. 接受 Android licenses
      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses
      
      # 7. 清理构建缓存
      - name: Flutter clean
        run: flutter clean
      
      # 8. 配置 Gradle 内存限制防 OOM
      - name: Configure Gradle memory
        run: |
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2 -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false
          android.enableAapt2Daemon=false
          EOF
      
      # 9. 获取依赖
      - name: Get dependencies
        run: flutter pub get
        working-directory: .
      
      # 10. 代码分析
      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        working-directory: .
      
      # 11. 运行测试
      - name: Run tests
        run: flutter test
        working-directory: .
      
      # 12. 诊断环境信息（便于排查）
      - name: Diagnose environment
        run: |
          echo "=== Flutter doctor ==="
          flutter doctor -v
          echo "=== Android SDK/NDK ==="
          ls -la $ANDROID_HOME/ndk/ 2>/dev/null || echo "NDK not found in $ANDROID_HOME/ndk"
          ls -la $ANDROID_HOME/build-tools/ 2>/dev/null || echo "Build tools not found"
          echo "=== Gradle wrapper ==="
          cat android/gradle/wrapper/gradle-wrapper.properties
          echo "=== Project gradle.properties ==="
          cat android/gradle.properties
          echo "=== app build.gradle.kts ==="
          cat android/app/build.gradle.kts | head -50
      
      # 13. 构建 Release APK
      - name: Build APK
        run: |
          # 创建构建日志文件
          touch build.log
          echo "=== Build log created at $(date) ===" > build.log
          echo "Working directory: $(pwd)" >> build.log
          echo "PATH: $PATH" >> build.log
          
          echo "=== Starting Flutter build at $(date) ===" >> build.log
          
          # 运行构建并同时输出到控制台和日志文件
          flutter build apk --release --split-per-abi --verbose 2>&1 | tee -a build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          echo "=== Build finished with exit code: $BUILD_EXIT_CODE at $(date) ===" >> build.log
          # 保存退出码到环境变量供后续步骤使用
          echo "BUILD_EXIT_CODE=$BUILD_EXIT_CODE" >> $GITHUB_ENV
          if [ $BUILD_EXIT_CODE -ne 0 ]; then
            echo "=== BUILD FAILED ===" >> build.log
            exit 1
          fi
        env:
          FLUTTER_VERBOSE: 1
        continue-on-error: true
      
      # 14. 确保构建日志文件存在（即使构建失败）
      - name: Ensure build log exists
        if: always()
        run: |
          if [ ! -f build.log ]; then
            echo "=== build.log not found, creating minimal log ===" > build.log
            echo "Build step may have failed before creating log file" >> build.log
            echo "Working directory: $(pwd)" >> build.log
            echo "Build exit code: ${{ env.BUILD_EXIT_CODE }}" >> build.log
            ls -la >> build.log
          fi
      
# 16. 查找 APK 文件
      - name: Find APK files
        run: |
          echo "=== Full build/app/outputs tree ==="
          find build/app/outputs -type f -name "*.apk" 2>/dev/null | head -30 || echo "No APKs found in build/app/outputs"
          # 保存找到的第一个 APK 路径供后续步骤使用
          APK_PATH=$(find build/app/outputs -type f -name "*.apk" 2>/dev/null | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV
            echo "First APK found at: $APK_PATH"
          else
            echo "WARNING: No APK found anywhere in build/app/outputs"
            echo "APK_PATH=build/app/outputs/flutter-apk/*.apk" >> $GITHUB_ENV
          fi
      
      # 16. 上传构建产物
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/apk/**/*.apk
          retention-days: 30
      
      # 17. 准备发布信息
      - name: Prepare release notes
        id: release_notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.inputs.version }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "name=Release $TAG" >> $GITHUB_OUTPUT
          echo "body=$(git log --oneline -10)" >> $GITHUB_OUTPUT
      
      # 18. 创建 GitHub Release 并上传 APK
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ steps.release_notes.outputs.tag }}
          name: ${{ steps.release_notes.outputs.name }}
          body: |
            ## 实时翻译 - ${{ steps.release_notes.outputs.tag }}
            
            ### 更新内容
            ${{ steps.release_notes.outputs.body }}
            
            ### 下载
            - `app-release.apk` - 通用 APK (包含所有 ABI)
            - `app-arm64-v8a-release.apk` - ARM64 设备
            - `app-armeabi-v7a-release.apk` - ARM32 设备
            - `app-x86_64-release.apk` - x86_64 设备
            
            ### 安装说明
            1. 下载对应架构的 APK 文件
            2. 在手机上启用"允许安装未知来源应用"
            3. 安装 APK
            4. 打开应用，授予必要权限（录音、悬浮窗、通知）
            5. 在快捷设置面板添加"实时翻译"磁贴
            6. 点击磁贴或应用内按钮开始实时翻译
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}