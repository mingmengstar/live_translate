name: Build Release APK (arm64-v8a)

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # 手动触发

permissions:
  contents: read

jobs:
  build:
    name: Flutter Build APK (ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # --- 基础环境 ---
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: 'stable'
          cache: true
          cache-key: flutter-:${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}

      # --- Android SDK / NDK 预装在 GitHub 托管镜像里，直接可用 ---
      - name: Accept Android licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      # --- 下载模型文件从 GitHub Release ---
      - name: Download models from Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets/models
          # 使用 gh CLI 下载 release assets
          gh release download v1.0.0-models --repo mingmengstar/live_translate --dir assets/models --pattern "*.onnx" --pattern "*.txt" --pattern "*.gguf"
          ls -la assets/models/

      # --- 依赖安装 ---
      - name: Get Flutter dependencies
        run: flutter pub get

      # --- 构建前准备：限制内存防 OOM ---
      - name: Configure Gradle memory
        run: |
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx4g -Dorg.gradle.workers.max=2 -Dorg.gradle.daemon=false -Dorg.gradle.parallel=false
          android.enableAapt2Daemon=false
          EOF

      # --- 构建 Release APK (仅 arm64-v8a) ---
      - name: Build Release APK (arm64-v8a)
        run: flutter build apk --release --target-platform android-arm64 --verbose

      # --- 上传产物 ---
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-arm64-v8a-release
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30

      # --- 可选：自动创建 Release 并挂载 APK (需先建 tag) ---
      # - name: Create Release
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     files: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      #     generate_release_notes: true