name: live_translate
description: 实时翻译 - 基于系统内录的端侧实时字幕应用

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # 核心依赖
  # 注：system_audio_recorder 已移除——其 0.0.1 版在 Android 14+ 上必崩
  # （前台服务未声明 / ClassCastException / 通知无 smallIcon /
  #   缺 foregroundServiceType → getMediaProjection SecurityException）。
  # 系统内录改由本项目自研的 android/.../AudioCaptureService.kt 实现。
  flutter_screen_overlay: ^1.0.7
  quick_settings_with_flutter_plugins: ^1.3.1
  sherpa_onnx: ^2.0.3

  # 翻译引擎（llama.cpp FFI 绑定）。
  #
  # 为什么从 0.2.2 换到 0.9.0-dev.12：
  # - 0.2.2 的 pubspec 没有 `flutter: plugin:` 段，包内也不含任何 Android
  #   `.so`（只有 OpenCL 的 libOpenCL.so），所以它的 android/build.gradle
  #   根本不进 Flutter 的 Gradle 构建图 → 产物里没有 libmtmd.so
  #   → 真机 `DynamicLibrary.open("libmtmd.so")` 必失败（旧的 P0-4）。
  # - 0.9.0-dev.12 是官方重写版，改走 native assets 构建钩子
  #   （hook/build.dart），并自带 native/android/llama-cpp-dart.aar，
  #   内含 jni/arm64-v8a/{libllama,libmtmd,libggml,libggml-base,libggml-cpu}.so。
  #   Flutter 3.47+ 的 nativeAssets 特性在 stable 默认开启，钩子会自动
  #   解包并作为 code asset 打进 APK，**不需要改 app 的 Gradle/CMake**。
  # - 已知限制：该 AAR 只带 arm64-v8a。armeabi-v7a / x86_64 的 APK 里
  #   没有 llama.cpp，这两个架构上 MT 会自动降级 Mock（不崩溃）。
  # - 它仍是 prerelease，API 与 0.2.x 完全不兼容，故 llama_mt.dart 已重写。
  llama_cpp_dart: 0.9.0-dev.12

  # 状态管理与工具
  provider: ^6.1.1
  permission_handler: ^11.3.1
  path_provider: ^2.1.2
  shared_preferences: ^2.2.2
  # 模型下载后的 SHA-256 完整性校验
  #
  # 注：曾经预留过 file_picker（想用 SAF 选目录），但最终「自定义模型目录」
  # 走的是「手输绝对路径」方案，lib/ 里从未 import 它。
  # 它自带 Android 原生 AAR，在 AGP 9.3.1 下有 AAR 元数据冲突风险，
  # 属于「零收益 + 高 CI 风险」，故移除。将来真需要 SAF 再加回。
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  # 资源文件
  assets:
    - assets/models/
